on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - pkgs/bluesky-app/default.nix
  pull_request:
    paths:
      - .github/workflows/bluesky-app-deps-hash.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  nixpkgs_version: e2587caef70cea85dd97d7daab492899902dbf5d # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  update-hashes:
    # Don't self-trigger.
    if: github.event_name != 'push' || github.event.head_commit.message != github.workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      # Use an app token so the resulting push re-triggers CI;
      # GITHUB_TOKEN-pushed commits don't fire workflow events.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz

      - name: Recompute hashes
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
          GIT_USER: ${{ github.actor }}
        run: |
          nix-shell -p nix-update --run "nix-update bluesky-app --version=skip --subpackage=src"
          if git diff --exit-code; then
            echo "No changes to commit"
          else
            git config --global user.name "$GIT_USER"
            git config --global user.email "${GIT_USER}[bot]@users.noreply.github.com"
            git commit -am "${{ github.workflow }}"
            "$DRY_RUN" || git push
          fi
